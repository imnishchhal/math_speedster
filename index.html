<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Speedster - Speed Arithmetic Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- 🏆 TOP BAR: Leaderboard Topper Display -->
        <header class="top-bar">
            <div id="global-topper-badge" class="topper-badge">
                👑 All-Time Topper: Loading...
            </div>
            <button id="btn-switch-user" class="btn-text-small" style="display: none;">🔄 Switch User</button>
        </header>

        <!-- Mobile Authentication Screen -->
        <div id="auth-screen" class="card-panel">
            <h1>🚀 Math Speedster</h1>
            <p class="subtitle">Enter WhatsApp number to start playing</p>
            <form id="mobile-auth-form">
                <input type="tel" id="user-mobile" placeholder="10-digit WhatsApp Number" pattern="[0-9]{10}" required>
                <button type="submit" class="btn btn-primary">Verify & Play</button>
            </form>
        </div>

        <!-- Student Selection Screen -->
        <div id="student-select-screen" class="card-panel" style="display: none;">
            <h2>Select Profile</h2>
            <div id="student-list" class="profile-list"></div>
        </div>

        <!-- Main Game Arena -->
        <div id="game-arena" class="card-panel" style="display: none;">
            <div class="game-header">
                <div>Timer: <span id="game-timer">30</span>s</div>
                <div>Score: <span id="game-score">0</span></div>
            </div>
            
            <div id="equation-box" class="equation-display">? + ?</div>
            
            <div class="input-area">
                <input type="number" id="user-answer" placeholder="Ans" autofocus autocomplete="off">
                <button id="btn-submit-ans" class="btn btn-primary">Submit</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="card-panel" style="display: none;">
            <h2>🎉 Game Over!</h2>
            <p>Your Score: <span id="final-score">0</span></p>
            <p>Personal Best: <span id="personal-high-score">0</span></p>
            <button id="btn-play-again" class="btn btn-primary">Play Again 🔄</button>
        </div>
    </div>

    <script type="module" src="app.js?v=2.0"></script>
</body>
</html>
